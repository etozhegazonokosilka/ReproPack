name: Bug report
description: Help make a ReproPack problem reproducible.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a problem. Do not include credentials, private
        keys, source files, or any other sensitive data.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observed behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Provide the smallest reliable sequence of steps.
      placeholder: |
        1. Install ReproPack...
        2. Run...
        3. Observe...
    validations:
      required: true
  - type: textarea
    id: report
    attributes:
      label: Diagnostic report
      description: Attach a reviewed ReproPack archive or paste only safe, relevant details.
  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add anything else that may help investigate the problem.
