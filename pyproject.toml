[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "repropack"
version = "0.1.0"
description = "Create safe diagnostic archives for reproducible bug reports."
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "etozhegazonokosilka" }]
dependencies = [
    "jinja2>=3.1,<4",
    "pydantic>=2.7,<3",
    "rich>=13,<15",
    "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.11,<2",
    "pytest>=8,<9",
    "ruff>=0.6,<1",
]

[project.scripts]
repropack = "repropack.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
repropack = ["reports/templates/*.j2"]
